<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexus AI - Yapay Zeka Asistanı</title>
    <!-- Google Gemini SDK -->
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.run/@google/genai"
        }
      }
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 85vh;
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #334155;
        }
        .chat-header {
            background: #0f172a;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #334155;
        }
        .chat-header h2 {
            font-size: 1.25rem;
            color: #38bdf8;
            font-weight: 600;
        }
        .chat-header p {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 4px;
        }
        #chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #0f172a;
        }
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user-message {
            background: #2563eb;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .gemini-message {
            background: #334155;
            color: #f8fafc;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .loading-message {
            background: #334155;
            color: #94a3b8;
            align-self: flex-start;
            font-style: italic;
        }
        .input-area {
            padding: 15px 20px;
            background: #1e293b;
            display: flex;
            gap: 10px;
            border-top: 1px solid #334155;
        }
        input {
            flex: 1;
            padding: 12px 16px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #38bdf8;
        }
        button {
            padding: 0 20px;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #0ea5e9;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <h2>Lexus AI Asistanı 🚀</h2>
            <p>Gemini altyapısıyla güçlendirilmiştir</p>
        </div>
        
        <div id="chat-box">
            <div class="message gemini-message">Merhaba! Ben Lexus AI. Size bugün nasıl yardımcı olabilirim?</div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Bir şeyler yazın..." onkeydown="if(event.key === 'Enter') mesajGonder()">
            <button onclick="mesajGonder()">Gönder</button>
        </div>
    </div>

    <script type="module">
        import { GoogleGenAI } from "@google/genai";

        const ai = new GoogleGenAI({ apiKey: "AQ.Ab8RN6KdOPbt_oVxXDMU5-T952GEkgA9CZUb3JOkK-CNDsqaog" });

        window.mesajGonder = async function() {
            const inputField = document.getElementById("user-input");
            const chatBox = document.getElementById("chat-box");
            const userText = inputField.value.trim();

            if (!userText) return;

            // Kullanıcı mesajını ekrana ekle
            chatBox.innerHTML += `<div class="message user-message">${userText}</div>`;
            inputField.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            // Yükleniyor balonu ekle
            const loadingId = "loading-" + Date.now();
            chatBox.innerHTML += `<div id="${loadingId}" class="message loading-message">Lexus AI düşünüyor...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await ai.models.generateContent({
                    model: 'gemini-3.8-flash',
                    contents: userText,
                });

                // Yükleniyor balonunu kaldır
                document.getElementById(loadingId).remove();

                // Gemini yanıtını ekrana ekle
                chatBox.innerHTML += `<div class="message gemini-message">${response.text}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `<div class="message gemini-message" style="color:#f87171;">Hata oluştu: ${error.message}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        };
    </script>

</body>
</html>
