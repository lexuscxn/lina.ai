<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexus AI - Yapay Zeka Asistanı</title>
    <!-- Google Gemini SDK -->
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.run/@google/genai"
        }
      }
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #090514;
            color: #f1f5f9;
            display: flex;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Hareketli Arkaplan Tuvali */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Sol Yan Menü */
        .sidebar {
            width: 280px;
            background: rgba(12, 8, 28, 0.85);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 15px;
            z-index: 10;
        }

        .new-chat-btn {
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(168, 85, 247, 0.3);
            text-align: center;
        }

        .new-chat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(168, 85, 247, 0.5);
        }

        .history-title {
            font-size: 0.8rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-top: 10px;
            font-weight: 600;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            color: #cbd5e1;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.05);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s ease;
        }

        .history-item:hover {
            background: rgba(168, 85, 247, 0.15);
            border-color: rgba(168, 85, 247, 0.3);
            color: #ffffff;
        }

        /* Ana Sohbet Alanı */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            z-index: 10;
            position: relative;
        }

        .chat-container {
            width: 100%;
            max-width: 850px;
            height: 90vh;
            background: rgba(19, 13, 40, 0.75);
            backdrop-filter: blur(24px);
            border-radius: 28px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(168, 85, 247, 0.18);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .chat-header {
            background: rgba(12, 8, 28, 0.8);
            padding: 22px 28px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .chat-header h2 {
            font-size: 1.5rem;
            background: linear-gradient(90deg, #c084fc, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .chat-header p {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 4px;
        }

        #chat-box {
            flex: 1;
            padding: 28px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        #chat-box::-webkit-scrollbar {
            width: 6px;
        }
        #chat-box::-webkit-scrollbar-thumb {
            background: rgba(168, 85, 247, 0.35);
            border-radius: 10px;
        }

        .message {
            max-width: 80%;
            padding: 15px 20px;
            border-radius: 20px;
            font-size: 0.98rem;
            line-height: 1.6;
            word-wrap: break-word;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
        }

        .user-message {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .gemini-message {
            background: rgba(30, 22, 60, 0.85);
            color: #f1f5f9;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(168, 85, 247, 0.25);
        }

        .loading-message {
            background: rgba(30, 22, 60, 0.6);
            color: #c084fc;
            align-self: flex-start;
            font-style: italic;
        }

        /* Input ve Artı (+) Alanı */
        .input-area {
            padding: 20px 24px;
            background: rgba(12, 8, 28, 0.9);
            display: flex;
            align-items: center;
            gap: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
        }

        .attach-btn {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #c084fc;
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .attach-btn:hover {
            background: rgba(168, 85, 247, 0.25);
            border-color: rgba(168, 85, 247, 0.5);
            color: #ffffff;
            transform: rotate(90deg);
        }

        .attach-menu {
            position: absolute;
            bottom: 80px;
            left: 24px;
            background: rgba(20, 14, 45, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 18px;
            padding: 10px;
            display: none;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            z-index: 100;
            min-width: 180px;
        }

        .attach-menu.active {
            display: flex;
        }

        .menu-item {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            color: #e2e8f0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-item:hover {
            background: rgba(168, 85, 247, 0.2);
            color: #ffffff;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #a855f7;
            background: rgba(255, 255, 255, 0.08);
        }

        button.send-btn {
            padding: 0 26px;
            height: 48px;
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(168, 85, 247, 0.35);
        }

        button.send-btn:hover {
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="sidebar">
        <button class="new-chat-btn" onclick="yeniSohbet()">+ Yeni Sohbet</button>
        <div class="history-title">Geçmiş Sohbetler</div>
        <div class="history-list" id="history-list"></div>
    </div>

    <div class="main-content">
        <div class="chat-container">
            <div class="chat-header">
                <h2>Lexus AI ⚡</h2>
                <p>Gelişmiş Yapay Zeka Asistanı</p>
            </div>
            
            <div id="chat-box">
                <div class="message gemini-message">Merhaba! Ben Lexus AI. Size bugün nasıl yardımcı olabilirim?</div>
            </div>

            <div class="input-area">
                <div class="attach-btn" onclick="toggleMenu()">+</div>

                <div class="attach-menu" id="attachMenu">
                    <div class="menu-item" onclick="dosyaSecTetikle()">📁 Dosya Ekle</div>
                    <div class="menu-item" onclick="kodSablonuEkle()">💻 Kod Şablonu</div>
                </div>

                <input type="file" id="file-input" style="display:none;" onchange="dosyaSecildi(event)">
                <input type="text" id="user-input" placeholder="Lexus AI'a bir şeyler sorun..." onkeydown="if(event.key === 'Enter') mesajGonder()">
                <button class="send-btn" onclick="mesajGonder()">Gönder</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { GoogleGenAI } from "@google/genai";

        const API_KEY = "AQ.Ab8RN6L-oRIEgaGrsnj89xeYVjcZHMucPb03MFW2gLJeLFbiAQ";
        const ai = new GoogleGenAI({ apiKey: API_KEY });

        let sohbetGecmisi = [];

        window.mesajGonder = async function() {
            const inputField = document.getElementById("user-input");
            const chatBox = document.getElementById("chat-box");
            const userText = inputField.value.trim();

            if (!userText) return;

            if (sohbetGecmisi.length === 0) {
                gecmiseEkle(userText);
            }

            chatBox.innerHTML += `<div class="message user-message">${userText}</div>`;
            inputField.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            const loadingId = "loading-" + Date.now();
            chatBox.innerHTML += `<div id="${loadingId}" class="message loading-message">Lexus AI düşünüyor...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await ai.models.generateContent({
                    model: 'gemini-2.5-flash',
                    contents: userText,
                });

                document.getElementById(loadingId)?.remove();
                chatBox.innerHTML += `<div class="message gemini-message">${response.text}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                document.getElementById(loadingId)?.remove();
                chatBox.innerHTML += `<div class="message gemini-message" style="color:#f87171;">Hata: ${error.message}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        };

        function gecmiseEkle(baslik) {
            sohbetGecmisi.push(baslik);
            const historyList = document.getElementById("history-list");
            historyList.innerHTML = "";
            sohbetGecmisi.forEach((item) => {
                historyList.innerHTML += `<div class="history-item">${item}</div>`;
            });
        }

        window.yeniSohbet = function() {
            const chatBox = document.getElementById("chat-box");
            chatBox.innerHTML = `<div class="message gemini-message">Yeni sohbet başlatıldı! Size nasıl yardımcı olabilirim?</div>`;
            sohbetGecmisi = [];
            document.getElementById("history-list").innerHTML = "";
        };

        window.toggleMenu = function() {
            const menu = document.getElementById("attachMenu");
            menu.classList.toggle("active");
        };

        window.dosyaSecTetikle = function() {
            document.getElementById("attachMenu").classList.remove("active");
            document.getElementById("file-input").click();
        };

        window.dosyaSecildi = function(e) {
            const file = e.target.files[0];
            if (file) {
                const inputField = document.getElementById("user-input");
                inputField.value = `[Dosya: ${file.name}] ` + inputField.value;
            }
        };

        window.kodSablonuEkle = function() {
            document.getElementById("attachMenu").classList.remove("active");
            const inputField = document.getElementById("user-input");
            inputField.value = "```javascript\n\n```";
            inputField.focus();
        };

        document.addEventListener('click', (e) => {
            const menu = document.getElementById("attachMenu");
            const btn = document.querySelector(".attach-btn");
            if (menu && btn && !menu.contains(e.target) && !btn.contains(e.target)) {
                menu.classList.remove("active");
            }
        });
    </script>

    <!-- Arkaplan Parçacık Animasyonu -->
    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const particles = Array.from({ length: 40 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 2.5 + 1,
            vx: (Math.random() - 0.5) * 0.5,
            vy: (Math.random() - 0.5) * 0.5,
            color: ['#a855f7', '#6366f1', '#38bdf8'][Math.floor(Math.random() * 3)]
        }));

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach((p, i) => {
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = p.color;
                ctx.fill();

                for (let j = i + 1; j < particles.length; j++) {
                    const p2 = particles[j];
                    const dx = p.x - p2.x;
                    const dy = p.y - p2.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 120) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `rgba(168, 85, 247, ${1 - dist / 120 * 0.7})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            });

            requestAnimationFrame(animate);
        }
        animate();
    </script>

</body>
</html>
