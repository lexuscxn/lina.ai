<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linda.Ai - Gelişmiş Yapay Zeka Asistanı</title>

    <!-- Firebase SDK (Gerçek Kimlik Doğrulama) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithPopup, 
            GoogleAuthProvider, 
            GithubAuthProvider,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Firebase Yapılandırması (Kendi Firebase Projenizin bilgilerini buraya yazabilirsiniz)
        const firebaseConfig = {
            apiKey: "AIzaSy_BURAYA_FIREBASE_API_KEY_GELECEK",
            authDomain: "linda-ai-app.firebaseapp.com",
            projectId: "linda-ai-app",
            storageBucket: "linda-ai-app.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        window.firebaseAuth = auth;
        window.GoogleAuthProvider = GoogleAuthProvider;
        window.GithubAuthProvider = GithubAuthProvider;
        window.signInWithPopup = signInWithPopup;
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
        window.signOut = signOut;

        // Kullanıcı Oturum Durumunu Takip Et (Her F5'te Otomatik Tanır)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById("display-user-name").innerText = user.displayName || user.email.split('@')[0];
                document.getElementById("display-user-email").innerText = user.email;
                document.getElementById("user-avatar").innerText = (user.displayName || user.email).charAt(0).toUpperCase();
                if(user.photoURL) {
                    document.getElementById("user-avatar").innerHTML = `<img src="${user.photoURL}" style="width:100%;height:100%;border-radius:50%;">`;
                }
                document.getElementById("logout-btn").style.display = "block";
            } else {
                document.getElementById("display-user-name").innerText = "Misafir Kullanıcı";
                document.getElementById("display-user-email").innerText = "Giriş Yapılmadı";
                document.getElementById("user-avatar").innerText = "M";
                document.getElementById("logout-btn").style.display = "none";
            }
        });
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: #0b0518;
            color: #f8fafc;
            display: flex;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Canlı Hareketli Tuval */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Sol Yan Menü */
        .sidebar {
            width: 300px;
            background: rgba(18, 10, 38, 0.75);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-right: 1px solid rgba(232, 121, 249, 0.15);
            display: flex;
            flex-direction: column;
            padding: 22px;
            gap: 16px;
            z-index: 10;
        }

        .new-chat-btn {
            background: linear-gradient(135deg, #d946ef 0%, #a855f7 50%, #6366f1 100%);
            color: white;
            border: none;
            border-radius: 16px;
            padding: 14px 20px;
            font-weight: 700;
            font-size: 0.98rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(217, 70, 239, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .new-chat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(217, 70, 239, 0.55);
            filter: brightness(1.1);
        }

        .history-title {
            font-size: 0.75rem;
            color: #c084fc;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-top: 6px;
            font-weight: 800;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-list::-webkit-scrollbar {
            width: 4px;
        }
        .history-list::-webkit-scrollbar-thumb {
            background: rgba(217, 70, 239, 0.25);
            border-radius: 10px;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.9rem;
            color: #e2e8f0;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.06);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-item.active-chat {
            background: rgba(217, 70, 239, 0.25);
            border-color: rgba(217, 70, 239, 0.6);
            color: #ffffff;
            font-weight: 700;
        }

        .history-item:hover {
            background: rgba(217, 70, 239, 0.18);
            border-color: rgba(217, 70, 239, 0.4);
            color: #ffffff;
        }

        .delete-chat-btn {
            background: none;
            border: none;
            color: #f87171;
            opacity: 0.6;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 2px 6px;
        }

        .delete-chat-btn:hover {
            opacity: 1;
        }

        /* Sol Alt Menü */
        .sidebar-footer {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .user-profile-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            cursor: pointer;
            flex: 1;
            transition: background 0.2s;
            overflow: hidden;
        }

        .user-profile-card:hover {
            background: rgba(217, 70, 239, 0.15);
        }

        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f472b6, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.9rem;
            color: white;
            box-shadow: 0 0 10px rgba(244, 114, 182, 0.4);
            flex-shrink: 0;
        }

        .user-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .user-name {
            font-size: 0.85rem;
            font-weight: 700;
            color: #f1f5f9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-email {
            font-size: 0.72rem;
            color: #94a3b8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #c084fc;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .icon-btn:hover {
            background: rgba(217, 70, 239, 0.2);
            color: #ffffff;
        }

        /* Ana Sohbet Alanı */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            z-index: 10;
            position: relative;
        }

        .chat-container {
            width: 100%;
            max-width: 950px;
            height: 92vh;
            background: rgba(22, 12, 45, 0.65);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border-radius: 32px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.85), 0 0 60px rgba(217, 70, 239, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(232, 121, 249, 0.2);
        }

        .chat-header {
            background: rgba(14, 8, 30, 0.75);
            padding: 20px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* Saf CSS Glowing Amblem (JPG Yerine) */
        .css-emblem {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #d946ef, #a855f7, #38bdf8, #f472b6, #d946ef);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(217, 70, 239, 0.6);
            animation: rotateEmblem 8s linear infinite;
        }

        .css-emblem-inner {
            width: 22px;
            height: 22px;
            background: #0b0518;
            border-radius: 50%;
        }

        @keyframes rotateEmblem {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .header-info h2 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, #f472b6, #d946ef, #a855f7, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .header-info p {
            font-size: 0.82rem;
            color: #a7f3d0;
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
        }

        #chat-box {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        #chat-box::-webkit-scrollbar {
            width: 6px;
        }
        #chat-box::-webkit-scrollbar-thumb {
            background: rgba(217, 70, 239, 0.4);
            border-radius: 10px;
        }

        .message {
            max-width: 78%;
            padding: 16px 22px;
            border-radius: 22px;
            font-size: 0.98rem;
            line-height: 1.6;
            word-wrap: break-word;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .user-message {
            background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 6px;
            box-shadow: 0 8px 25px rgba(236, 72, 153, 0.35);
        }

        .gemini-message {
            background: rgba(35, 18, 65, 0.85);
            color: #f8fafc;
            align-self: flex-start;
            border-bottom-left-radius: 6px;
            border: 1px solid rgba(217, 70, 239, 0.3);
        }

        .loading-message {
            background: rgba(35, 18, 65, 0.5);
            color: #f472b6;
            align-self: flex-start;
            font-style: italic;
            border: 1px dashed rgba(217, 70, 239, 0.5);
        }

        /* Input Alanı */
        .input-area {
            padding: 22px 30px;
            background: rgba(14, 8, 30, 0.85);
            display: flex;
            align-items: center;
            gap: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
        }

        .attach-btn {
            width: 50px;
            height: 50px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(217, 70, 239, 0.3);
            color: #f472b6;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
        }

        .attach-btn:hover {
            background: rgba(217, 70, 239, 0.3);
            border-color: rgba(217, 70, 239, 0.7);
            color: #ffffff;
            transform: rotate(90deg) scale(1.05);
        }

        .attach-menu {
            position: absolute;
            bottom: 85px;
            left: 30px;
            background: rgba(25, 12, 50, 0.95);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(217, 70, 239, 0.4);
            border-radius: 20px;
            padding: 12px;
            display: none;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            z-index: 100;
            min-width: 210px;
        }

        .attach-menu.active {
            display: flex;
        }

        .menu-item {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.92rem;
            color: #e2e8f0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
        }

        .menu-item:hover {
            background: rgba(217, 70, 239, 0.25);
            color: #ffffff;
            transform: translateX(4px);
        }

        input[type="text"] {
            flex: 1;
            padding: 16px 22px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(217, 70, 239, 0.2);
            border-radius: 16px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]::placeholder {
            color: #94a3b8;
        }

        input[type="text"]:focus {
            border-color: #d946ef;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 25px rgba(217, 70, 239, 0.35);
        }

        button.send-btn {
            padding: 0 32px;
            height: 50px;
            background: linear-gradient(135deg, #d946ef 0%, #a855f7 100%);
            color: #ffffff;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(217, 70, 239, 0.4);
        }

        button.send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(217, 70, 239, 0.6);
        }

        /* MODAL POPUP */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 2, 12, 0.75);
            backdrop-filter: blur(15px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: rgba(25, 14, 52, 0.95);
            border: 1px solid rgba(217, 70, 239, 0.35);
            border-radius: 24px;
            padding: 28px;
            width: 90%;
            max-width: 440px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(217, 70, 239, 0.2);
            display: flex;
            flex-direction: column;
            gap: 18px;
            animation: modalIn 0.25s ease;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 12px;
        }

        .modal-header h3 {
            font-size: 1.2rem;
            color: #f472b6;
            font-weight: 800;
        }

        .close-modal-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.4rem;
            cursor: pointer;
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.82rem;
            color: #c084fc;
            font-weight: 600;
        }

        .form-control {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: white;
            outline: none;
            font-size: 0.95rem;
        }

        .form-control:focus {
            border-color: #d946ef;
        }

        .social-login-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 6px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.04);
            color: #f1f5f9;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .social-btn:hover {
            background: rgba(217, 70, 239, 0.2);
            border-color: rgba(217, 70, 239, 0.5);
            transform: translateY(-2px);
        }

        .save-modal-btn {
            background: linear-gradient(135deg, #d946ef, #8b5cf6);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(217, 70, 239, 0.3);
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <!-- Sol Yan Menü -->
    <div class="sidebar">
        <button class="new-chat-btn" onclick="yeniSohbet()">
            <span>+</span> Yeni Sohbet
        </button>

        <div class="history-title">Geçmiş Sohbetler</div>
        <div class="history-list" id="history-list"></div>

        <div class="sidebar-footer">
            <div class="user-profile-card" onclick="openModal('accountModal')">
                <div class="avatar" id="user-avatar">M</div>
                <div class="user-info">
                    <div class="user-name" id="display-user-name">Misafir Kullanıcı</div>
                    <div class="user-email" id="display-user-email">Giriş Yapılmadı</div>
                </div>
            </div>
            <div class="icon-btn" onclick="openModal('settingsModal')" title="Ayarlar">⚙️</div>
            <div class="icon-btn" id="logout-btn" onclick="cikisYap()" title="Çıkış Yap" style="display:none; color:#f87171;">🚪</div>
        </div>
    </div>

    <!-- Sağ Ana Sohbet Bölümü -->
    <div class="main-content">
        <div class="chat-container">
            <div class="chat-header">
                <div class="logo-container">
                    <div class="css-emblem"><div class="css-emblem-inner"></div></div>
                    <div class="header-info">
                        <h2>Linda.Ai ✨</h2>
                        <p><span class="status-dot"></span> Yapay Zeka Asistanı Çevrimiçi</p>
                    </div>
                </div>
            </div>
            
            <div id="chat-box"></div>

            <div class="input-area">
                <div class="attach-btn" onclick="toggleMenu()" title="Eklenti Menüsü">+</div>

                <div class="attach-menu" id="attachMenu">
                    <div class="menu-item" onclick="dosyaSecTetikle()">📁 Dosya/Görsel Yükle</div>
                    <div class="menu-item" onclick="kodSablonuEkle()">💻 Kod Şablonu Ekle</div>
                </div>

                <input type="file" id="file-input" style="display:none;" onchange="dosyaSecildi(event)">
                <input type="text" id="user-input" placeholder="Linda.Ai'a bir şeyler sorun..." onkeydown="if(event.key === 'Enter') mesajGonder()">
                <button class="send-btn" onclick="mesajGonder()">Gönder</button>
            </div>
        </div>
    </div>

    <!-- HESAP / FIREBASE GİRİŞ MODALI -->
    <div class="modal-overlay" id="accountModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Gerçek Hesap Girişi</h3>
                <button class="close-modal-btn" onclick="closeModal('accountModal')">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>E-Posta Adresi</label>
                    <input type="email" id="email-input" class="form-control" placeholder="ornek@email.com">
                </div>
                <div class="form-group">
                    <label>Şifre</label>
                    <input type="password" id="password-input" class="form-control" placeholder="••••••••">
                </div>
                <button class="save-modal-btn" onclick="emailGirisYap()">E-Posta ile Giriş / Kayıt</button>

                <div class="form-group" style="margin-top: 10px;">
                    <label>Tek Tıkla Giriş Yap</label>
                    <div class="social-login-grid">
                        <button class="social-btn" onclick="googleGirisYap()">🌐 Google</button>
                        <button class="social-btn" onclick="githubGirisYap()">🐙 GitHub</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- AYARLAR MODALI -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Sistem Ayarları</h3>
                <button class="close-modal-btn" onclick="closeModal('settingsModal')">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Yapay Zeka Modeli</label>
                    <select id="model-select" class="form-control">
                        <option value="gemini-2.5-flash">Gemini 2.5 Flash (Hızlı)</option>
                        <option value="gemini-1.5-pro">Gemini 1.5 Pro (Gelişmiş)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>API Key (Google AI Studio)</label>
                    <input type="password" id="api-key-input" class="form-control" value="AQ.Ab8RN6KaQnDmmuEJDdc27lHer2276B4i14mOmgT6ydtkCfAkOA">
                </div>
                <button class="save-modal-btn" onclick="saveSettings()">Ayarları Kaydet</button>
            </div>
        </div>
    </div>

    <script>
        let API_KEY = localStorage.getItem("LINDA_API_KEY") || "AQ.Ab8RN6KaQnDmmuEJDdc27lHer2276B4i14mOmgT6ydtkCfAkOA";
        let MODEL_NAME = localStorage.getItem("LINDA_MODEL") || "gemini-2.5-flash";

        // Sohbet Deposu (localStorage ile Kalıcı Hafıza)
        let sohbetDeposu = JSON.parse(localStorage.getItem("LINDA_CHATS")) || [];
        let aktifSohbetId = localStorage.getItem("LINDA_ACTIVE_CHAT_ID") || null;

        window.onload = function() {
            document.getElementById("api-key-input").value = API_KEY;
            document.getElementById("model-select").value = MODEL_NAME;

            if (sohbetDeposu.length === 0) {
                yeniSohbet();
            } else {
                if(!aktifSohbetId || !sohbetDeposu.find(s => s.id == aktifSohbetId)) {
                    aktifSohbetId = sohbetDeposu[0].id;
                }
                sohbetiYukle(aktifSohbetId);
            }
        };

        function verileriKaydet() {
            localStorage.setItem("LINDA_CHATS", JSON.stringify(sohbetDeposu));
            localStorage.setItem("LINDA_ACTIVE_CHAT_ID", aktifSohbetId);
        }

        window.mesajGonder = async function() {
            const inputField = document.getElementById("user-input");
            const chatBox = document.getElementById("chat-box");
            const userText = inputField.value.trim();

            if (!userText) return;

            let mevcutSohbet = sohbetDeposu.find(s => s.id == aktifSohbetId);
            if (!mevcutSohbet) {
                mevcutSohbet = {
                    id: Date.now(),
                    title: userText.length > 22 ? userText.substring(0, 22) + '...' : userText,
                    messages: []
                };
                sohbetDeposu.unshift(mevcutSohbet);
                aktifSohbetId = mevcutSohbet.id;
            } else if (mevcutSohbet.messages.length === 0) {
                mevcutSohbet.title = userText.length > 22 ? userText.substring(0, 22) + '...' : userText;
            }

            mevcutSohbet.messages.push({ sender: 'user', text: userText });
            verileriKaydet();

            chatBox.innerHTML += `<div class="message user-message">${userText}</div>`;
            inputField.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            sohbetListesiniGuncelle();

            const loadingId = "loading-" + Date.now();
            chatBox.innerHTML += `<div id="${loadingId}" class="message loading-message">Linda.Ai düşünüyor...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${API_KEY}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: userText }] }]
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId)?.remove();

                if (data.candidates && data.candidates[0] && data.candidates[0].content.parts[0].text) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    mevcutSohbet.messages.push({ sender: 'ai', text: aiReply });
                    verileriKaydet();
                    chatBox.innerHTML += `<div class="message gemini-message">${aiReply}</div>`;
                } else if (data.error) {
                    chatBox.innerHTML += `<div class="message gemini-message" style="color:#f87171;">Hata: ${data.error.message}</div>`;
                } else {
                    chatBox.innerHTML += `<div class="message gemini-message" style="color:#f87171;">Yanıt alınamadı.</div>`;
                }

                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                document.getElementById(loadingId)?.remove();
                chatBox.innerHTML += `<div class="message gemini-message" style="color:#f87171;">Bağlantı Hatası: ${error.message}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        };

        window.yeniSohbet = function() {
            const yeniId = Date.now();
            const yeniSohbetObj = {
                id: yeniId,
                title: "Yeni Sohbet",
                messages: []
            };
            sohbetDeposu.unshift(yeniSohbetObj);
            aktifSohbetId = yeniId;
            verileriKaydet();

            sohbetiYukle(yeniId);
        };

        function sohbetiYukle(id) {
            aktifSohbetId = id;
            verileriKaydet();

            const sohbet = sohbetDeposu.find(s => s.id == id);
            const chatBox = document.getElementById("chat-box");
            
            chatBox.innerHTML = "";
            if (!sohbet || sohbet.messages.length === 0) {
                chatBox.innerHTML = `<div class="message gemini-message">Merhaba! Ben Linda.Ai. Size bugün nasıl yardımcı olabilirim?</div>`;
            } else {
                sohbet.messages.forEach(m => {
                    const msgClass = m.sender === 'user' ? 'user-message' : 'gemini-message';
                    chatBox.innerHTML += `<div class="message ${msgClass}">${m.text}</div>`;
                });
            }
            chatBox.scrollTop = chatBox.scrollHeight;
            sohbetListesiniGuncelle();
        }

        function sohbetiSil(e, id) {
            e.stopPropagation();
            sohbetDeposu = sohbetDeposu.filter(s => s.id != id);
            if (sohbetDeposu.length === 0) {
                yeniSohbet();
            } else {
                if (aktifSohbetId == id) {
                    aktifSohbetId = sohbetDeposu[0].id;
                }
                verileriKaydet();
                sohbetiYukle(aktifSohbetId);
            }
        }

        function sohbetListesiniGuncelle() {
            const historyList = document.getElementById("history-list");
            historyList.innerHTML = "";
            sohbetDeposu.forEach((s) => {
                const activeClass = s.id == aktifSohbetId ? 'active-chat' : '';
                historyList.innerHTML += `
                    <div class="history-item ${activeClass}" onclick="sohbetiYukle(${s.id})">
                        <span>${s.title}</span>
                        <button class="delete-chat-btn" onclick="sohbetiSil(event, ${s.id})">✕</button>
                    </div>`;
            });
        }

        /* FIREBASE AUTHENTICATION GİRİŞ FONKSİYONLARI */
        window.googleGirisYap = async function() {
            try {
                const provider = new window.GoogleAuthProvider();
                await window.signInWithPopup(window.firebaseAuth, provider);
                closeModal("accountModal");
            } catch (error) {
                alert("Google Giriş Hatası: " + error.message);
            }
        };

        window.githubGirisYap = async function() {
            try {
                const provider = new window.GithubAuthProvider();
                await window.signInWithPopup(window.firebaseAuth, provider);
                closeModal("accountModal");
            } catch (error) {
                alert("GitHub Giriş Hatası: " + error.message);
            }
        };

        window.emailGirisYap = async function() {
            const email = document.getElementById("email-input").value;
            const password = document.getElementById("password-input").value;
            if(!email || !password) return alert("Lütfen email ve şifre girin.");

            try {
                await window.signInWithEmailAndPassword(window.firebaseAuth, email, password);
                closeModal("accountModal");
            } catch (error) {
                try {
                    await window.createUserWithEmailAndPassword(window.firebaseAuth, email, password);
                    closeModal("accountModal");
                } catch (err) {
                    alert("Giriş/Kayıt Hatası: " + err.message);
                }
            }
        };

        window.cikisYap = async function() {
            await window.signOut(window.firebaseAuth);
        };

        /* Modal Fonksiyonları */
        window.openModal = function(id) { document.getElementById(id).classList.add("active"); };
        window.closeModal = function(id) { document.getElementById(id).classList.remove("active"); };

        window.saveSettings = function() {
            MODEL_NAME = document.getElementById("model-select").value;
            API_KEY = document.getElementById("api-key-input").value;
            localStorage.setItem("LINDA_API_KEY", API_KEY);
            localStorage.setItem("LINDA_MODEL", MODEL_NAME);
            alert("Ayarlar kaydedildi!");
            closeModal("settingsModal");
        };

        /* Eklenti Menüsü */
        window.toggleMenu = function() { document.getElementById("attachMenu").classList.toggle("active"); };
        window.dosyaSecTetikle = function() {
            document.getElementById("attachMenu").classList.remove("active");
            document.getElementById("file-input").click();
        };

        window.dosyaSecildi = function(e) {
            const file = e.target.files[0];
            if (file) {
                const inputField = document.getElementById("user-input");
                inputField.value = `[Dosya: ${file.name}] ` + inputField.value;
            }
        };

        window.kodSablonuEkle = function() {
            document.getElementById("attachMenu").classList.remove("active");
            const inputField = document.getElementById("user-input");
            inputField.value = "```javascript\n\n```";
            inputField.focus();
        };

        document.addEventListener('click', (e) => {
            const menu = document.getElementById("attachMenu");
            const btn = document.querySelector(".attach-btn");
            if (menu && btn && !menu.contains(e.target) && !btn.contains(e.target)) {
                menu.classList.remove("active");
            }
        });
    </script>

    <!-- Parçacık Arkaplan Animasyonu -->
    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const colors = ['#f472b6', '#d946ef', '#a855f7', '#c084fc', '#818cf8'];

        const particles = Array.from({ length: 45 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 3 + 1,
            vx: (Math.random() - 0.5) * 0.5,
            vy: (Math.random() - 0.5) * 0.5,
            color: colors[Math.floor(Math.random() * colors.length)]
        }));

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach((p, i) => {
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 12;
                ctx.shadowColor = p.color;
                ctx.fill();

                for (let j = i + 1; j < particles.length; j++) {
                    const p2 = particles[j];
                    const dx = p.x - p2.x;
                    const dy = p.y - p2.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 120) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `rgba(217, 70, 239, ${1 - dist / 120 * 0.5})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            });

            requestAnimationFrame(animate);
        }
        animate();
    </script>
