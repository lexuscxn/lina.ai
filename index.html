<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linda.Ai - Gelişmiş Yapay Zeka Asistanı</title>
    <!-- Favicon (Sayfa Logosu) -->
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: #0b0518;
            color: #f8fafc;
            display: flex;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Canlı Hareketli Tuval */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Sol Yan Menü */
        .sidebar {
            width: 300px;
            background: rgba(18, 10, 38, 0.75);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-right: 1px solid rgba(232, 121, 249, 0.15);
            display: flex;
            flex-direction: column;
            padding: 22px;
            gap: 16px;
            z-index: 10;
        }

        .new-chat-btn {
            background: linear-gradient(135deg, #d946ef 0%, #a855f7 50%, #6366f1 100%);
            color: white;
            border: none;
            border-radius: 16px;
            padding: 14px 20px;
            font-weight: 700;
            font-size: 0.98rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(217, 70, 239, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .new-chat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(217, 70, 239, 0.55);
            filter: brightness(1.1);
        }

        .history-title {
            font-size: 0.75rem;
            color: #c084fc;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-top: 6px;
            font-weight: 800;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-list::-webkit-scrollbar {
            width: 4px;
        }
        .history-list::-webkit-scrollbar-thumb {
            background: rgba(217, 70, 239, 0.25);
            border-radius: 10px;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.9rem;
            color: #e2e8f0;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.06);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s ease;
        }

        .history-item.active-chat {
            background: rgba(217, 70, 239, 0.25);
            border-color: rgba(217, 70, 239, 0.6);
            color: #ffffff;
            font-weight: 700;
        }

        .history-item:hover {
            background: rgba(217, 70, 239, 0.18);
            border-color: rgba(217, 70, 239, 0.4);
            color: #ffffff;
            transform: translateX(4px);
        }

        /* Sol Alt Menü (Profil ve Ayarlar) */
        .sidebar-footer {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .user-profile-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            cursor: pointer;
            flex: 1;
            transition: background 0.2s;
        }

        .user-profile-card:hover {
            background: rgba(217, 70, 239, 0.15);
        }

        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f472b6, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.9rem;
            color: white;
            box-shadow: 0 0 10px rgba(244, 114, 182, 0.4);
        }

        .user-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .user-name {
            font-size: 0.85rem;
            font-weight: 700;
            color: #f1f5f9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-email {
            font-size: 0.72rem;
            color: #94a3b8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .settings-icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #c084fc;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.2s;
        }

        .settings-icon-btn:hover {
            background: rgba(217, 70, 239, 0.2);
            color: #ffffff;
            transform: rotate(45deg);
        }

        /* Ana Sohbet Alanı */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            z-index: 10;
            position: relative;
        }

        .chat-container {
            width: 100%;
            max-width: 950px;
            height: 92vh;
            background: rgba(22, 12, 45, 0.65);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border-radius: 32px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.85), 0 0 60px rgba(217, 70, 239, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(232, 121, 249, 0.2);
        }

        .chat-header {
            background: rgba(14, 8, 30, 0.75);
            padding: 20px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand-logo {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(217, 70, 239, 0.5);
            box-shadow: 0 0 20px rgba(217, 70, 239, 0.5);
            animation: logoPulse 4s infinite ease-in-out;
        }

        @keyframes logoPulse {
            0%, 100% { transform: scale(1) rotate(0deg); box-shadow: 0 0 20px rgba(217, 70, 239, 0.5); }
            50% { transform: scale(1.05) rotate(180deg); box-shadow: 0 0 35px rgba(244, 114, 182, 0.8); }
        }

        .header-info h2 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, #f472b6, #d946ef, #a855f7, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .header-info p {
            font-size: 0.82rem;
            color: #a7f3d0;
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
        }

        #chat-box {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        #chat-box::-webkit-scrollbar {
            width: 6px;
        }
        #chat-box::-webkit-scrollbar-thumb {
            background: rgba(217, 70, 239, 0.4);
            border-radius: 10px;
        }

        .message {
            max-width: 78%;
            padding: 16px 22px;
            border-radius: 22px;
            font-size: 0.98rem;
            line-height: 1.6;
            word-wrap: break-word;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .user-message {
            background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 6px;
            box-shadow: 0 8px 25px rgba(236, 72, 153, 0.35);
        }

        .gemini-message {
            background: rgba(35, 18, 65, 0.85);
            color: #f8fafc;
            align-self: flex-start;
            border-bottom-left-radius: 6px;
            border: 1px solid rgba(217, 70, 239, 0.3);
        }

        .loading-message {
            background: rgba(35, 18, 65, 0.5);
            color: #f472b6;
            align-self: flex-start;
            font-style: italic;
            border: 1px dashed rgba(217, 70, 239, 0.5);
        }

        /* Gelişmiş Input Alanı */
        .input-area {
            padding: 22px 30px;
            background: rgba(14, 8, 30, 0.85);
            display: flex;
            align-items: center;
            gap: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
        }

        .attach-btn {
            width: 50px;
            height: 50px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(217, 70, 239, 0.3);
            color: #f472b6;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
        }

        .attach-btn:hover {
            background: rgba(217, 70, 239, 0.3);
            border-color: rgba(217, 70, 239, 0.7);
            color: #ffffff;
            transform: rotate(90deg) scale(1.05);
        }

        .attach-menu {
            position: absolute;
            bottom: 85px;
            left: 30px;
            background: rgba(25, 12, 50, 0.95);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(217, 70, 239, 0.4);
            border-radius: 20px;
            padding: 12px;
            display: none;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            z-index: 100;
            min-width: 210px;
        }

        .attach-menu.active {
            display: flex;
        }

        .menu-item {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.92rem;
            color: #e2e8f0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
        }

        .menu-item:hover {
            background: rgba(217, 70, 239, 0.25);
            color: #ffffff;
            transform: translateX(4px);
        }

        input[type="text"] {
            flex: 1;
            padding: 16px 22px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(217, 70, 239, 0.2);
            border-radius: 16px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]::placeholder {
            color: #94a3b8;
        }

        input[type="text"]:focus {
            border-color: #d946ef;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 25px rgba(217, 70, 239, 0.35);
        }

        button.send-btn {
            padding: 0 32px;
            height: 50px;
            background: linear-gradient(135deg, #d946ef 0%, #a855f7 100%);
            color: #ffffff;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(217, 70, 239, 0.4);
        }

        button.send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(217, 70, 239, 0.6);
        }

        /* MODAL POPUP */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 2, 12, 0.75);
            backdrop-filter: blur(15px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: rgba(25, 14, 52, 0.95);
            border: 1px solid rgba(217, 70, 239, 0.35);
            border-radius: 24px;
            padding: 28px;
            width: 90%;
            max-width: 440px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(217, 70, 239, 0.2);
            display: flex;
            flex-direction: column;
            gap: 18px;
            animation: modalIn 0.25s ease;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 12px;
        }

        .modal-header h3 {
            font-size: 1.2rem;
            color: #f472b6;
            font-weight: 800;
        }

        .close-modal-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.4rem;
            cursor: pointer;
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.82rem;
            color: #c084fc;
            font-weight: 600;
        }

        .form-control {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: white;
            outline: none;
            font-size: 0.95rem;
        }

        .form-control:focus {
            border-color: #d946ef;
        }

        /* Sosyal Medya Giriş Butonları */
        .social-login-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 6px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.04);
            color: #f1f5f9;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .social-btn:hover {
            background: rgba(217, 70, 239, 0.2);
            border-color: rgba(217, 70, 239, 0.5);
            transform: translateY(-2px);
        }

        .social-btn.google:hover { background: rgba(234, 67, 53, 0.25); border-color: rgba(234, 67, 53, 0.5); }
        .social-btn.discord:hover { background: rgba(88, 101, 242, 0.25); border-color: rgba(88, 101, 242, 0.5); }
        .social-btn.apple:hover { background: rgba(255, 255, 255, 0.25); border-color: rgba(255, 255, 255, 0.5); }
        .social-btn.github:hover { background: rgba(110, 84, 148, 0.25); border-color: rgba(110, 84, 148, 0.5); }

        .save-modal-btn {
            background: linear-gradient(135deg, #d946ef, #8b5cf6);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(217, 70, 239, 0.3);
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
        }
    </style>
</head>
<body>

    <!-- Canlı Hareketli Arkaplan Tuvali -->
    <canvas id="bg-canvas"></canvas>

    <!-- Sol Yan Menü -->
    <div class="sidebar">
        <button class="new-chat-btn" onclick="yeniSohbet()">
            <span>+</span> Yeni Sohbet
        </button>

        <div class="history-title">Geçmiş Sohbetler</div>
        <div class="history-list" id="history-list"></div>

        <div class="sidebar-footer">
            <div class="user-profile-card" onclick="openModal('accountModal')">
                <div class="avatar" id="user-avatar">L</div>
                <div class="user-info">
                    <div class="user-name" id="display-user-name">Lexus User</div>
                    <div class="user-email" id="display-user-email">user@linda.ai</div>
                </div>
            </div>
            <div class="settings-icon-btn" onclick="openModal('settingsModal')" title="Ayarlar">⚙️</div>
        </div>
    </div>

    <!-- Sağ Ana Sohbet Bölümü -->
    <div class="main-content">
        <div class="chat-container">
            <div class="chat-header">
                <div class="logo-container">
                    <img id="main-logo-img" src="logo.jpg" alt="Linda.Ai Logo" class="brand-logo" onerror="logoYuklemeHatasi(this)">
                    <div class="header-info">
                        <h2>Linda.Ai ✨</h2>
                        <p><span class="status-dot"></span> Yapay Zeka Asistanı Çevrimiçi</p>
                    </div>
                </div>
            </div>
            
            <div id="chat-box">
                <div class="message gemini-message">Merhaba! Ben Linda.Ai. Size bugün nasıl yardımcı olabilirim?</div>
            </div>

            <div class="input-area">
                <div class="attach-btn" onclick="toggleMenu()" title="Eklenti Menüsü">+</div>

                <div class="attach-menu" id="attachMenu">
                    <div class="menu-item" onclick="dosyaSecTetikle()">📁 Dosya/Görsel Yükle</div>
                    <div class="menu-item" onclick="kodSablonuEkle()">💻 Kod Şablonu Ekle</div>
                </div>

                <input type="file" id="file-input" style="display:none;" onchange="dosyaSecildi(event)">
                <input type="text" id="user-input" placeholder="Linda.Ai'a bir şeyler sorun..." onkeydown="if(event.key === 'Enter') mesajGonder()">
                <button class="send-btn" onclick="mesajGonder()">Gönder</button>
            </div>
        </div>
    </div>

    <!-- HESAP EKLEME & SOSYAL MEYDA GİRİŞ MODALI -->
    <div class="modal-overlay" id="accountModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Hesap Ekle / Değiştir</h3>
                <button class="close-modal-btn" onclick="closeModal('accountModal')">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Kullanıcı Adı</label>
                    <input type="text" id="account-name-input" class="form-control" value="Lexus User">
                </div>
                <div class="form-group">
                    <label>E-Posta Adresi</label>
                    <input type="email" id="account-email-input" class="form-control" value="user@linda.ai">
                </div>

                <div class="form-group" style="margin-top: 8px;">
                    <label>Hızlı Giriş Yap / Hesap Bağla</label>
                    <div class="social-login-grid">
                        <button class="social-btn google" onclick="socialLogin('Google')">🌐 Google</button>
                        <button class="social-btn discord" onclick="socialLogin('Discord')">👾 Discord</button>
                        <button class="social-btn apple" onclick="socialLogin('Apple')">🍏 Apple</button>
                        <button class="social-btn github" onclick="socialLogin('GitHub')">🐙 GitHub</button>
                    </div>
                </div>

                <button class="save-modal-btn" onclick="saveAccountInfo()">Hesabı Güncelle</button>
            </div>
        </div>
    </div>

    <!-- AYARLAR MODALI -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Sistem Ayarları</h3>
                <button class="close-modal-btn" onclick="closeModal('settingsModal')">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Yapay Zeka Modeli</label>
                    <select id="model-select" class="form-control">
                        <option value="gemini-2.5-flash">Gemini 2.5 Flash (Hızlı)</option>
                        <option value="gemini-1.5-pro">Gemini 1.5 Pro (Gelişmiş)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>API Key (Google AI Studio)</label>
                    <input type="password" id="api-key-input" class="form-control" value="AQ.Ab8RN6KaQnDmmuEJDdc27lHer2276B4i14mOmgT6ydtkCfAkOA">
                </div>
                <button class="save-modal-btn" onclick="saveSettings()">Ayarları Kaydet</button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT MANTIĞI -->
    <script>
        let API_KEY = "AQ.Ab8RN6KaQnDmmuEJDdc27lHer2276B4i14mOmgT6ydtkCfAkOA";
        let MODEL_NAME = "gemini-2.5-flash";

        // Geçmiş sohbet veri deposu
        let sohbetDeposu = [];
        let aktifSohbetId = null;

        // Sayfa yüklendiğinde ilk sohbeti oluştur
        window.onload = function() {
            yeniSohbet();
        };

        function logoYuklemeHatasi(img) {
            // Görsel yüklenemezse varsayılan logo alternatifine yönlendir
            img.onerror = null;
            img.src = 'https://raw.githubusercontent.com/lexuscxn/lexus.ai/main/logo.jpg';
        }

        window.mesajGonder = async function() {
            const inputField = document.getElementById("user-input");
            const chatBox = document.getElementById("chat-box");
            const userText = inputField.value.trim();

            if (!userText) return;

            // Aktif sohbet nesnesini al veya oluştur
            let mevcutSohbet = sohbetDeposu.find(s => s.id === aktifSohbetId);
            if (!mevcutSohbet) {
                mevcutSohbet = {
                    id: Date.now(),
                    title: userText.length > 25 ? userText.substring(0, 25) + '...' : userText,
                    messages: []
                };
                sohbetDeposu.unshift(mevcutSohbet);
                aktifSohbetId = mevcutSohbet.id;
            } else if (mevcutSohbet.messages.length === 0) {
                mevcutSohbet.title = userText.length > 25 ? userText.substring(0, 25) + '...' : userText;
            }

            // Kullanıcı mesajını kaydet
            mevcutSohbet.messages.push({ sender: 'user', text: userText });
            chatBox.innerHTML += `<div class="message user-message">${userText}</div>`;
            inputField.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            sohbetListesiniGuncelle();

            const loadingId = "loading-" + Date.now();
            chatBox.innerHTML += `<div id="${loadingId}" class="message loading-message">Linda.Ai yanıt hazırlıyor...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${API_KEY}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: userText }] }]
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId)?.remove();

                if (data.candidates && data.candidates[0] && data.candidates[0].content.parts[0].text) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    mevcutSohbet.messages.push({ sender: 'ai', text: aiReply });
                    chatBox.innerHTML += `<div class="message gemini-message">${aiReply}</div>`;
                } else if (data.error) {
                    const errorMsg = "Hata: " + data.error.message;
                    chatBox.innerHTML += `<div class="message gemini-message" style="color:#f87171;">${errorMsg}</div>`;
                } else {
                    chatBox.innerHTML += `<div class="message gemini-message" style="color:#f87171;">Yanıt alınamadı.</div>`;
                }

                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                document.getElementById(loadingId)?.remove();
                chatBox.innerHTML += `<div class="message gemini-message" style="color:#f87171;">Bağlantı Hatası: ${error.message}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        };

        window.yeniSohbet = function() {
            const yeniId = Date.now();
            const yeniSohbetObj = {
                id: yeniId,
                title: "Yeni Sohbet",
                messages: []
            };
            sohbetDeposu.unshift(yeniSohbetObj);
            aktifSohbetId = yeniId;

            const chatBox = document.getElementById("chat-box");
            chatBox.innerHTML = `<div class="message gemini-message">Merhaba! Ben Linda.Ai. Size bugün nasıl yardımcı olabilirim?</div>`;
            
            sohbetListesiniGuncelle();
        };

        function sohbetiYukle(id) {
            aktifSohbetId = id;
            const sohbet = sohbetDeposu.find(s => s.id === id);
            const chatBox = document.getElementById("chat-box");
            
            if (!sohbet || sohbet.messages.length === 0) {
                chatBox.innerHTML = `<div class="message gemini-message">Merhaba! Ben Linda.Ai. Size bugün nasıl yardımcı olabilirim?</div>`;
            } else {
                chatBox.innerHTML = "";
                sohbet.messages.forEach(m => {
                    const msgClass = m.sender === 'user' ? 'user-message' : 'gemini-message';
                    chatBox.innerHTML += `<div class="message ${msgClass}">${m.text}</div>`;
                });
            }
            chatBox.scrollTop = chatBox.scrollHeight;
            sohbetListesiniGuncelle();
        }

        function sohbetListesiniGuncelle() {
            const historyList = document.getElementById("history-list");
            historyList.innerHTML = "";
            sohbetDeposu.forEach((s) => {
                const activeClass = s.id === aktifSohbetId ? 'active-chat' : '';
                historyList.innerHTML += `<div class="history-item ${activeClass}" onclick="sohbetiYukle(${s.id})">${s.title}</div>`;
            });
        }

        /* Modal Fonksiyonları */
        window.openModal = function(id) {
            document.getElementById(id).classList.add("active");
        };

        window.closeModal = function(id) {
            document.getElementById(id).classList.remove("active");
        };

        window.saveAccountInfo = function() {
            const name = document.getElementById("account-name-input").value;
            const email = document.getElementById("account-email-input").value;
            document.getElementById("display-user-name").innerText = name;
            document.getElementById("display-user-email").innerText = email;
            document.getElementById("user-avatar").innerText = name.charAt(0).toUpperCase();
            closeModal("accountModal");
        };

        window.socialLogin = function(provider) {
            document.getElementById("account-name-input").value = provider + " Kullanıcısı";
            document.getElementById("account-email-input").value = provider.toLowerCase() + "@linda.ai";
            saveAccountInfo();
            alert(`${provider} hesabı başarıyla bağlandı!`);
        };

        window.saveSettings = function() {
            MODEL_NAME = document.getElementById("model-select").value;
            API_KEY = document.getElementById("api-key-input").value;
            alert("Ayarlar başarıyla güncellendi!");
            closeModal("settingsModal");
        };

        /* Eklenti Menüsü */
        window.toggleMenu = function() {
            document.getElementById("attachMenu").classList.toggle("active");
        };

        window.dosyaSecTetikle = function() {
            document.getElementById("attachMenu").classList.remove("active");
            document.getElementById("file-input").click();
        };

        window.dosyaSecildi = function(e) {
            const file = e.target.files[0];
            if (file) {
                const inputField = document.getElementById("user-input");
                inputField.value = `[Dosya: ${file.name}] ` + inputField.value;
            }
        };

        window.kodSablonuEkle = function() {
            document.getElementById("attachMenu").classList.remove("active");
            const inputField = document.getElementById("user-input");
            inputField.value = "```javascript\n\n```";
            inputField.focus();
        };

        document.addEventListener('click', (e) => {
            const menu = document.getElementById("attachMenu");
            const btn = document.querySelector(".attach-btn");
            if (menu && btn && !menu.contains(e.target) && !btn.contains(e.target)) {
                menu.classList.remove("active");
            }
        });
    </script>

    <!-- LOGO RENKLERİNDE CANLI PARÇACIK ANİMASYONU -->
    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const colors = ['#f472b6', '#d946ef', '#a855f7', '#c084fc', '#818cf8'];

        const particles = Array.from({ length: 50 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 3 + 1,
            vx: (Math.random() - 0.5) * 0.6,
            vy: (Math.random() - 0.5) * 0.6,
            color: colors[Math.floor(Math.random() * colors.length)]
        }));

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach((p, i) => {
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = p.color;
                ctx.fill();

                for (let j = i + 1; j < particles.length; j++) {
                    const p2 = particles[j];
                    const dx = p.x - p2.x;
                    const dy = p.y - p2.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 130) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `rgba(217, 70, 239, ${1 - dist / 130 * 0.6})`;
                        ctx.lineWidth = 0.6;
                        ctx.stroke();
                    }
                }
            });

            requestAnimationFrame(animate);
        }
        animate();
    </script>
