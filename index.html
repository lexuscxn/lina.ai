<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexus AI - Yapay Zeka Asistanı</title>
    <!-- Google Gemini SDK -->
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.run/@google/genai"

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #090514;
            color: #f1f5f9;
            display: flex;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Hareketli Arkaplan Tuvali */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Sol Yan Menü (Geçmiş Sohbetler) */
        .sidebar {
            width: 280px;
            background: rgba(12, 8, 28, 0.7);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 15px;
            z-index: 10;
        }

        .new-chat-btn {
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(168, 85, 247, 0.3);
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .new-chat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(168, 85, 247, 0.5);
        }

        .history-title {
            font-size: 0.8rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-top: 10px;
            font-weight: 600;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            color: #cbd5e1;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.05);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s ease;
        }

        .history-item:hover {
            background: rgba(168, 85, 247, 0.15);
            border-color: rgba(168, 85, 247, 0.3);
            color: #ffffff;
            transform: translateX(4px);
        }

        /* Ana Sohbet Alanı */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            z-index: 10;
            position: relative;
        }

        .chat-container {
            width: 100%;
            max-width: 850px;
            height: 90vh;
            background: rgba(19, 13, 40, 0.65);
            backdrop-filter: blur(24px);
            border-radius: 28px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(168, 85, 247, 0.18);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .chat-header {
            background: rgba(12, 8, 28, 0.8);
            padding: 22px 28px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .chat-header h2 {
            font-size: 1.5rem;
            background: linear-gradient(90deg, #c084fc, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .chat-header p {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 4px;
        }

        #chat-box {
            flex: 1;
            padding: 28px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        #chat-box::-webkit-scrollbar {
            width: 6px;
        }
        #chat-box::-webkit-scrollbar-thumb {
            background: rgba(168, 85, 247, 0.35);
            border-radius: 10px;
        }

        .message {
            max-width: 80%;
            padding: 15px 20px;
            border-radius: 20px;
            font-size: 0.98rem;
            line-height: 1.6;
            word-wrap: break-word;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .user-message {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .gemini-message {
            background: rgba(30, 22, 60, 0.85);
            color: #f1f5f9;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(168, 85, 247, 0.25);
        }

        .loading-message {
            background: rgba(30, 22, 60, 0.6);
            color: #c084fc;
            align-self: flex-start;
            font-style: italic;
            border: 1px dashed rgba(168, 85, 247, 0.4);
        }

        /* Input ve Artı (+) Butonu Alanı */
        .input-area {
            padding: 20px 24px;
            background: rgba(12, 8, 28, 0.85);
            display: flex;
            align-items: center;
            gap: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
        }

        .attach-btn {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #c084fc;
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
        }

        .attach-btn:hover {
            background: rgba(168, 85, 247, 0.25);
            border-color: rgba(168, 85, 247, 0.5);
            color: #ffffff;
            transform: rotate(90deg);
        }

        /* (+) Menü Popup */
        .attach-menu {
            position: absolute;
            bottom: 80px;
            left: 24px;
            background: rgba(20, 14, 45, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 18px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: all 0.3s ease;
            z-index: 100;
            min-width: 180px;
        }

        .attach-menu.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .menu-item {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            color: #e2e8f0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s;
        }

        .menu-item:hover {
            background: rgba(168, 85, 247, 0.2);
            color: #ffffff;
        }

            flex: 1;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.
