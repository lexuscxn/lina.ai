<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexus AI - Yapay Zeka Asistanı</title>
    <!-- Google Gemini SDK -->
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.run/@google/genai"
        }
      }
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c20 0%, #150d2a 50%, #080512 100%);
            color: #f1f5f9;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Yan Menü (Geçmiş Sohbetler) */
        .sidebar {
            width: 260px;
            background: rgba(12, 9, 24, 0.95);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 15px;
        }

        .new-chat-btn {
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.2);
            text-align: center;
        }

        .new-chat-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .history-title {
            font-size: 0.8rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 10px;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.9rem;
            color: #cbd5e1;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.05);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 0.2s;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.08);
            color: white;
        }

        /* Ana Sohbet Alanı */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: rgba(23, 15, 45, 0.75);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(139, 92, 246, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-header {
            background: rgba(15, 12, 32, 0.85);
            padding: 20px 28px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .chat-header h2 {
            font-size: 1.4rem;
            background: linear-gradient(90deg, #a855f7, #3b82f6, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .chat-header p {
            font-size: 0.82rem;
            color: #94a3b8;
            margin-top: 4px;
        }

        #chat-box {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        #chat-box::-webkit-scrollbar {
            width: 6px;
        }
        #chat-box::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.3);
            border-radius: 10px;
        }

        .message {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 0.98rem;
            line-height: 1.5;
            word-wrap: break-word;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .gemini-message {
            background: rgba(30, 27, 60, 0.85);
            color: #f1f5f9;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(139, 92, 246, 0.2);
        }

        .loading-message {
            background: rgba(30, 27, 60, 0.6);
            color: #c084fc;
            align-self: flex-start;
            font-style: italic;
            border: 1px dashed rgba(168, 85, 247, 0.4);
        }

        .input-area {
            padding: 18px 24px;
            background: rgba(15, 12, 32, 0.9);
            display: flex;
            gap: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        input {
            flex: 1;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus {
            border-color: #a855f7;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.25);
        }

        button.send-btn {
            padding: 0 24px;
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.98rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
        }

        button.send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.5);
        }

        /* Responsive / Mobil Uyum */
        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- Sol Yan Menü: Geçmiş Sohbetler -->
    <div class="sidebar">
        <button class="new-chat-btn" onclick="yeniSohbet()">+ Yeni Sohbet</button>
        <div class="history-title">Geçmiş Sohbetler</div>
        <div class="history-list" id="history-list">
            <!-- Geçmiş buraya otomatik eklenecek -->
        </div>
    </div>

    <!-- Sağ Ana Sohbet Bölümü -->
    <div class="main-content">
        <div class="chat-container">
            <div class="chat-header">
                <h2>Lexus AI ⚡</h2>
                <p>Gelişmiş Yapay Zeka Asistanı</p>
            </div>
            
            <div id="chat-box">
                <div class="message gemini-message">Merhaba! Ben Lexus AI. Size bugün nasıl yardımcı olabilirim?</div>
            </div>

            <div class="input-area">
                <input type="text" id="user-input" placeholder="Lexus AI'a bir şeyler sorun..." onkeydown="if(event.key === 'Enter') mesajGonder()">
                <button class="send-btn" onclick="mesajGonder()">Gönder</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { GoogleGenAI } from "@google/genai";

        const API_KEY = "AQ.Ab8RN6K6ANzOeoekDkglO_HjYi_1cC7yr1BfcuKhsCJIkwDqnQ";
        const ai = new GoogleGenAI({ apiKey: API_KEY });

        let sohbetGecmisi = [];

        window.mesajGonder = async function() {
            const inputField = document.getElementById("user-input");
            const chatBox = document.getElementById("chat-box");
            const userText = inputField.value.trim();

            if (!userText) return;

            // İlk mesajsa geçmiş listesine ekle
            if (sohbetGecmisi.length === 0) {
                gecmiseEkle(userText);
            }

            chatBox.innerHTML += `<div class="message user-message">${userText}</div>`;
            inputField.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            const loadingId = "loading-" + Date.now();
            chatBox.innerHTML += `<div id="${loadingId}" class="message loading-message">Lexus AI düşünüyor...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await ai.models.generateContent({
                    model: 'gemini-2.5-flash',
                    contents: userText,
                });

                document.getElementById(loadingId)?.remove();
                chatBox.innerHTML += `<div class="message gemini-message">${response.text}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                document.getElementById(loadingId)?.remove();
                chatBox.innerHTML += `<div class="message gemini-message" style="color:#f87171; border-color: #ef4444;">Hata: ${error.message}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        };

        function gecmiseEkle(baslik) {
            sohbetGecmisi.push(baslik);
            const historyList = document.getElementById("history-list");
            historyList.innerHTML = "";
            sohbetGecmisi.forEach((item) => {
                historyList.innerHTML += `<div class="history-item">${item}</div>`;
            });
        }

        window.yeniSohbet = function() {
            const chatBox = document.getElementById("chat-box");
            chatBox.innerHTML = `<div class="message gemini-message">Yeni sohbet başlatıldı! Size nasıl yardımcı olabilirim?</div>`;
            sohbetGecmisi = [];
            document.getElementById("history-list").innerHTML = "";
        };
    </script>

</body>
</html>
