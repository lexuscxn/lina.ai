<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linda.Ai - Gelişmiş Yapay Zeka Asistanı</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: #07030f;
            color: #f8fafc;
            display: flex;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Arkaplan Şık Işıltı Efektleri */
        .bg-glow-1, .bg-glow-2 {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 1;
            pointer-events: none;
        }
        .bg-glow-1 {
            width: 450px;
            height: 450px;
            background: rgba(168, 85, 247, 0.18);
            top: -100px;
            left: -100px;
        }
        .bg-glow-2 {
            width: 500px;
            height: 500px;
            background: rgba(56, 189, 248, 0.12);
            bottom: -150px;
            right: -100px;
        }

        /* Sol Yan Menü (Geçmiş Sohbetler) */
        .sidebar {
            width: 290px;
            background: rgba(12, 8, 25, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            padding: 24px;
            gap: 18px;
            z-index: 10;
        }

        .new-chat-btn {
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            color: white;
            border: none;
            border-radius: 16px;
            padding: 14px 18px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 25px rgba(168, 85, 247, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .new-chat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(168, 85, 247, 0.5);
            opacity: 0.95;
        }

        .history-title {
            font-size: 0.75rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
            font-weight: 700;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-list::-webkit-scrollbar {
            width: 4px;
        }
        .history-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.9rem;
            color: #cbd5e1;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.05);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s ease;
        }

        .history-item:hover {
            background: rgba(168, 85, 247, 0.15);
            border-color: rgba(168, 85, 247, 0.35);
            color: #ffffff;
            transform: translateX(4px);
        }

        /* Ana Sohbet Alanı */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            z-index: 10;
            position: relative;
        }

        .chat-container {
            width: 100%;
            max-width: 900px;
            height: 92vh;
            background: rgba(18, 12, 38, 0.65);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 32px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 50px rgba(168, 85, 247, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .chat-header {
            background: rgba(12, 8, 25, 0.6);
            padding: 24px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .header-info h2 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, #e879f9, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .header-info p {
            font-size: 0.82rem;
            color: #94a3b8;
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
        }

        #chat-box {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        #chat-box::-webkit-scrollbar {
            width: 6px;
        }
        #chat-box::-webkit-scrollbar-thumb {
            background: rgba(168, 85, 247, 0.3);
            border-radius: 10px;
        }

        .message {
            max-width: 78%;
            padding: 16px 22px;
            border-radius: 22px;
            font-size: 0.98rem;
            line-height: 1.6;
            word-wrap: break-word;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .user-message {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 6px;
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.3);
        }

        .gemini-message {
            background: rgba(28, 20, 56, 0.85);
            color: #f1f5f9;
            align-self: flex-start;
            border-bottom-left-radius: 6px;
            border: 1px solid rgba(168, 85, 247, 0.25);
        }

        .loading-message {
            background: rgba(28, 20, 56, 0.5);
            color: #c084fc;
            align-self: flex-start;
            font-style: italic;
            border: 1px dashed rgba(168, 85, 247, 0.4);
        }

        /* Gelişmiş Input ve Artı (+) Eklenti Alanı */
        .input-area {
            padding: 22px 30px;
            background: rgba(12, 8, 25, 0.8);
            display: flex;
            align-items: center;
            gap: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
        }

        .attach-btn {
            width: 50px;
            height: 50px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #c084fc;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
        }

        .attach-btn:hover {
            background: rgba(168, 85, 247, 0.25);
            border-color: rgba(168, 85, 247, 0.5);
            color: #ffffff;
            transform: rotate(90deg) scale(1.05);
        }

        /* Eklenti Pop-up Menüsü */
        .attach-menu {
            position: absolute;
            bottom: 85px;
            left: 30px;
            background: rgba(20, 14, 45, 0.95);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(168, 85, 247, 0.35);
            border-radius: 20px;
            padding: 12px;
            display: none;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            z-index: 100;
            min-width: 200px;
            animation: menuPop 0.2s ease;
        }

        @keyframes menuPop {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .attach-menu.active {
            display: flex;
        }

        .menu-item {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.92rem;
            color: #e2e8f0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
        }

        .menu-item:hover {
            background: rgba(168, 85, 247, 0.25);
            color: #ffffff;
            transform: translateX(4px);
        }

        input[type="text"] {
            flex: 1;
            padding: 16px 22px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]::placeholder {
            color: #64748b;
        }

        input[type="text"]:focus {
            border-color: #a855f7;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.25);
        }

        button.send-btn {
            padding: 0 30px;
            height: 50px;
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            color: #ffffff;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(168, 85, 247, 0.35);
        }

        button.send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(168, 85, 247, 0.55);
            opacity: 0.95;
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
        }
    </style>
</head>
<body>

    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <!-- Sol Yan Menü: Geçmiş Sohbetler -->
    <div class="sidebar">
        <button class="new-chat-btn" onclick="yeniSohbet()">
            <span>+</span> Yeni Sohbet
        </button>
        <div class="history-title">Geçmiş Sohbetler</div>
        <div class="history-list" id="history-list"></div>
    </div>

    <!-- Sağ Ana Sohbet Bölümü -->
    <div class="main-content">
        <div class="chat-container">
            <div class="chat-header">
                <div class="header-info">
                    <h2>Linda.Ai ✨</h2>
                    <p><span class="status-dot"></span> Yapay Zeka Asistanı Aktif</p>
                </div>
            </div>
            
            <div id="chat-box">
                <div class="message gemini-message">Merhaba! Ben Linda.Ai. Size bugün nasıl yardımcı olabilirim?</div>
            </div>

            <div class="input-area">
                <!-- Artı (+) Eklenti Butonu -->
                <div class="attach-btn" onclick="toggleMenu()" title="Eklenti Menüsü">+</div>

                <!-- (+) Popup Menü -->
                <div class="attach-menu" id="attachMenu">
                    <div class="menu-item" onclick="dosyaSecTetikle()">📁 Dosya veya Görsel Yükle</div>
                    <div class="menu-item" onclick="kodSablonuEkle()">💻 Kod Şablonu Ekle</div>
                </div>

                <!-- Gizli File Input -->
                <input type="file" id="file-input" style="display:none;" onchange="dosyaSecildi(event)">

                <input type="text" id="user-input" placeholder="Linda.Ai'a bir şeyler sorun..." onkeydown="if(event.key === 'Enter') mesajGonder()">
                <button class="send-btn" onclick="mesajGonder()">Gönder</button>
            </div>
        </div>
    </div>

    <script>
        // API Anahtarınızı ve modelinizi aşağıda tanımlayabilirsiniz:
        const API_KEY = "AQ.Ab8RN6L-oRIEgaGrsnj89xeYVjcZHMucPb03MFW2gLJeLFbiAQ";
        const MODEL_NAME = "gemini-2.5-flash";

        let sohbetGecmisi = [];

        window.mesajGonder = async function() {
            const inputField = document.getElementById("user-input");
            const chatBox = document.getElementById("chat-box");
            const userText = inputField.value.trim();

            if (!userText) return;

            if (sohbetGecmisi.length === 0) {
                gecmiseEkle(userText);
            }

            chatBox.innerHTML += `<div class="message user-message">${userText}</div>`;
            inputField.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            const loadingId = "loading-" + Date.now();
            chatBox.innerHTML += `<div id="${loadingId}" class="message loading-message">Linda.Ai düşünüyor...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${API_KEY}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: userText }] }]
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId)?.remove();

                if (data.candidates && data.candidates[0] && data.candidates[0].content.parts[0].text) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    chatBox.innerHTML += `<div class="message gemini-message">${aiReply}</div>`;
                } else if (data.error) {
                    chatBox.innerHTML += `<div class="message gemini-message" style="color:#f87171;">Hata: ${data.error.message}</div>`;
                } else {
                    chatBox.innerHTML += `<div class="message gemini-message" style="color:#f87171;">Yanıt alınamadı.</div>`;
                }

                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                document.getElementById(loadingId)?.remove();
                chatBox.innerHTML += `<div class="message gemini-message" style="color:#f87171;">Bağlantı Hatası: ${error.message}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        };

        function gecmiseEkle(baslik) {
            sohbetGecmisi.push(baslik);
            const historyList = document.getElementById("history-list");
            historyList.innerHTML = "";
            sohbetGecmisi.forEach((item) => {
                historyList.innerHTML += `<div class="history-item">${item}</div>`;
            });
        }

        window.yeniSohbet = function() {
            const chatBox = document.getElementById("chat-box");
            chatBox.innerHTML = `<div class="message gemini-message">Yeni sohbet başlatıldı! Size nasıl yardımcı olabilirim?</div>`;
            sohbetGecmisi = [];
            document.getElementById("history-list").innerHTML = "";
        };

        window.toggleMenu = function() {
            const menu = document.getElementById("attachMenu");
            menu.classList.toggle("active");
        };

        window.dosyaSecTetikle = function() {
            document.getElementById("attachMenu").classList.remove("active");
            document.getElementById("file-input").click();
        };

        window.dosyaSecildi = function(e) {
            const file = e.target.files[0];
            if (file) {
                const inputField = document.getElementById("user-input");
                inputField.value = `[Eklenen Dosya: ${file.name}] ` + inputField.value;
            }
        };

        window.kodSablonuEkle = function() {
            document.getElementById("attachMenu").classList.remove("active");
            const inputField = document.getElementById("user-input");
            inputField.value = "```javascript\n// Kodunuzu buraya yazın\n\n```";
            inputField.focus();
        };

        // Menü dışına tıklanınca kapatma
        document.addEventListener('click', (e) => {
            const menu = document.getElementById("attachMenu");
            const btn = document.querySelector(".attach-btn");
            if (menu && btn && !menu.contains(e.target) && !btn.contains(e.target)) {
                menu.classList.remove("active");
            }
        });
    </script>
</body>
</html>
