<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexus AI - Yapay Zeka Asistanı</title>
    <!-- Google Gemini SDK -->
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.run/@google/genai"
        }
      }
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c20 0%, #150d2a 50%, #080512 100%);
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 750px;
            height: 88vh;
            background: rgba(23, 15, 45, 0.75);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(139, 92, 246, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-header {
            background: rgba(15, 12, 32, 0.85);
            padding: 22px 28px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
        }

        .chat-header h2 {
            font-size: 1.5rem;
            background: linear-gradient(90deg, #a855f7, #3b82f6, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .chat-header p {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 5px;
            font-weight: 500;
        }

        #chat-box {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Özel kaydırma çubuğu */
        #chat-box::-webkit-scrollbar {
            width: 6px;
        }
        #chat-box::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.3);
            border-radius: 10px;
        }

        .message {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 0.98rem;
            line-height: 1.5;
            word-wrap: break-word;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .gemini-message {
            background: rgba(30, 27, 60, 0.85);
            color: #f1f5f9;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(139, 92, 246, 0.2);
        }

        .loading-message {
            background: rgba(30, 27, 60, 0.6);
            color: #c084fc;
            align-self: flex-start;
            font-style: italic;
            border: 1px dashed rgba(168, 85, 247, 0.4);
        }

        .input-area {
            padding: 18px 24px;
            background: rgba(15, 12, 32, 0.9);
            display: flex;
            gap: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        input {
            flex: 1;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus {
            border-color: #a855f7;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.25);
        }

        button {
            padding: 0 24px;
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.98rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.5);
            background: linear-gradient(135deg, #b875f8 0%, #7376f2 100%);
        }

        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <h2>Lexus AI ⚡</h2>
            <p>Gelişmiş Yapay Zeka Asistanı</p>
        </div>
        
        <div id="chat-box">
            <div class="message gemini-message">Merhaba! Ben Lexus AI. Size bugün nasıl yardımcı olabilirim?</div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Lexus AI'a bir şeyler sorun..." onkeydown="if(event.key === 'Enter') mesajGonder()">
            <button onclick="mesajGonder()">Gönder</button>
        </div>
    </div>

    <script type="module">
        import { GoogleGenAI } from "@google/genai";

        const ai = new GoogleGenAI({ apiKey: "AQ.Ab8RN6KdOPbt_oVxXDMU5-T952GEkgA9CZUb3JOkK-CNDsqaog" });

        window.mesajGonder = async function() {
            const inputField = document.getElementById("user-input");
            const chatBox = document.getElementById("chat-box");
            const userText = inputField.value.trim();

            if (!userText) return;

            // Kullanıcı mesajı
            chatBox.innerHTML += `<div class="message user-message">${userText}</div>`;
            inputField.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            // Yükleniyor balonu
            const loadingId = "loading-" + Date.now();
            chatBox.innerHTML += `<div id="${loadingId}" class="message loading-message">Lexus AI yanıt üretiyor...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            // Öncelikli model listesi (503 yoğunluk hatası verirse sıradakine geçer)
            const models = ['gemini-2.5-flash', 'gemini-2.5-flash-lite', 'gemini-2.0-flash'];
            let success = false;

            for (const modelName of models) {
                try {
                    const response = await ai.models.generateContent({
                        model: modelName,
                        contents: userText,
                    });

                    document.getElementById(loadingId)?.remove();
                    chatBox.innerHTML += `<div class="message gemini-message">${response.text}</div>`;
                    chatBox.scrollTop = chatBox.scrollHeight;
                    success = true;
                    break; 
                } catch (error) {
                    console.warn(`${modelName} denenirken hata oluştu:`, error);
                }
            }

            if (!success) {
                document.getElementById(loadingId)?.remove();
                chatBox.innerHTML += `<div class="message gemini-message" style="color:#f87171; border-color: #ef4444;">Sunucu yoğunluğu devam ediyor. Lütfen birkaç saniye sonra tekrar deneyin.</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        };
    </script>

</body>
</html>
